# Rustfmt configuration for Silent Hill 2 Port
# Reference: https://rust-lang.github.io/rustfmt/

edition = "2021"
max_width = 100
tab_spaces = 4
newline_style = "Unix"

# Import sorting & organization (equivalent to isort)
reorder_imports = true
reorder_modules = true

# Idiomatic cleanups
merge_derives = true
use_field_init_shorthand = true
use_try_shorthand = true
